<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="comandos">
    <input
        type="text"
        id="comando"
        placeholder="Digite: abrir hbo max"    >

    <button id="executar">
        Executar
    </button>

    <p id="resposta">
        JARVIS DESATIVADO.
    </p>

    <button id="ativar">
    Ativar Jarvis
</button>

<button id="desativar">
    Desativar Jarvis
</button>
</div>

<div class="camera-libras">
    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <canvas
    id="pontos-mao"
    width="640"
    height="480">
</canvas>

    <p id="status-camera">
        CÂMERA DESLIGADA
    </p>
</div>

  <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@mediapipe/tasks-vision": "./node_modules/@mediapipe/tasks-vision/vision_bundle.mjs"
    }
}
</script>

<script type="module" src="script.js"></script></body>
</html>
